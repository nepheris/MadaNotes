<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recherche matériel & IA — Mada Notes</title><link rel="stylesheet" href="../assets/css/main.css"><script defer src="../assets/js/site-nav.js?v=2.2.0"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="../">🔎 Recherche matériel & IA</a><nav data-site-nav></nav></div></header><main class="wrap"><section class="hero"><div class="inner"><span class="badge info">Google · Mode IA · Gemini</span><h1>Recherche documentaire par matériel</h1><p class="lead">Les requêtes reprennent les références connues pour cibler notices, tutoriels, dépannage et pièces sans mélanger les modèles proches.</p></div></section><section class="grid cols2" id="cards"></section></main><footer class="wrap footer"><a href="../">🏠 Accueil Mada Notes</a></footer><script>
const items=[
{id:'machine',icon:'🧺',name:'Machine à laver Touch / Futouch',ident:'XQG60-1016P · 6 kg · 220-240 V 50 Hz · S/N à relever sur plaque',page:'../maison/materiel/machine-a-laver.html'},
{id:'groupe',icon:'⛽',name:'Groupe électrogène Korman',ident:'01066672 · 3500 W · 223 cm³ · 8,5 CV · AVR',page:'../solaire/materiel/groupe-korman.html'},
{id:'batterie',icon:'🔋',name:'Batterie Greenline LiFePO4',ident:'M16S200BL-V dans le livret · 51,2 V · 200 Ah · 10,24 kWh · RS485/CAN',page:'../solaire/materiel/batterie.html'},
{id:'onduleur',icon:'⚡',name:'Onduleur Growatt 6 kVA',ident:'PF5359 · référence exacte à relever · candidats GA6248JMH / SPF 6000 ES Plus',page:'../solaire/materiel/onduleur.html'},
{id:'monitoring',icon:'📱',name:'Growatt monitoring',ident:'ShineWiFi-F PRO · ShinePhone · ShineServer · S/N et check code privés',page:'../solaire/materiel/growatt-monitoring.html'}];
const enc=encodeURIComponent, cards=document.getElementById('cards');
for(const x of items){const prompt=`Recherche une documentation fiable et exacte pour ${x.name}. Références : ${x.ident}. Trouve le manuel utilisateur, la fiche technique, des tutoriels d'entretien et de dépannage, les codes erreur et les pièces/consommables compatibles. Distingue le modèle exact des modèles proches et cite les sources fabricant.`;const manual=`${x.name} ${x.ident} manuel notice PDF`,tutorial=`${x.name} ${x.ident} tutoriel entretien depannage`;const a=document.createElement('article');a.className='card';a.id=x.id;a.innerHTML=`<h2>${x.icon} ${x.name}</h2><p class="small"><strong>Références :</strong> ${x.ident}</p><div class="doc-actions"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${enc(manual)}">📚 Google — manuel</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${enc(tutorial)}">🎥 Google — tutoriels</a><button class="btn primary ai-mode" type="button">✦ Google Mode IA</button><button class="btn gemini" type="button">✦ Gemini</button><a class="btn" href="${x.page}">Voir la fiche</a></div><details><summary>Requête IA exacte</summary><p class="small prompt"></p><button class="btn copy" type="button">Copier</button></details>`;a.querySelector('.prompt').textContent=prompt;const cp=async()=>{try{await navigator.clipboard.writeText(prompt)}catch{}};a.querySelector('.copy').onclick=cp;a.querySelector('.ai-mode').onclick=async()=>{await cp();window.open('https://www.google.com/ai','_blank','noopener')};a.querySelector('.gemini').onclick=async()=>{await cp();window.open('https://gemini.google.com/','_blank','noopener')};cards.appendChild(a)}
</script></body></html>

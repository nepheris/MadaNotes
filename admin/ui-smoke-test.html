<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoke tests UI — MadaNotes</title><link rel="stylesheet" href="../assets/css/main.css?v=2.0.3"><style>body{padding:20px}.test-grid{display:grid;gap:8px;margin:16px 0}.test{padding:10px 12px;border:1px solid #dbe3dd;border-radius:10px;background:#fff}.pass{border-left:5px solid #16834f}.fail{border-left:5px solid #b23b35}.pending{border-left:5px solid #8a9690}iframe{width:100%;height:700px;border:1px solid #dbe3dd;border-radius:12px;background:#fff}</style></head><body><main class="wrap"><h1>Smoke tests UI</h1><p class="muted">Contrôle automatique de l’accueil MadaNotes : header, navigation, aide, largeur, centrage et toolbar.</p><div id="results" class="test-grid"></div><iframe id="target" src="../?smoketest=2.0.3" title="Accueil MadaNotes"></iframe></main><script>(()=>{const out=document.getElementById('results'),frame=document.getElementById('target');const add=(name,ok,detail='')=>{const d=document.createElement('div');d.className='test '+(ok?'pass':'fail');d.textContent=(ok?'✓ ':'✗ ')+name+(detail?' — '+detail:'');out.appendChild(d)};frame.addEventListener('load',()=>{setTimeout(()=>{const w=frame.contentWindow,doc=frame.contentDocument;try{const quick=[...doc.querySelectorAll('.quick-nav a')];add('4 accès rapides présents',quick.length===4,String(quick.length));add('Lien Accueil',quick[0]?.getAttribute('href')==='/MadaNotes/');add('Lien Solaire',quick[1]?.getAttribute('href')==='/MadaNotes/solaire/');add('Lien Quad',quick[2]?.getAttribute('href')==='/MadaNotes/quad/');add('Lien SOS',quick[3]?.getAttribute('href')==='/MadaNotes/sos/');const menu=doc.querySelector('.site-menu'),summary=doc.querySelector('.site-menu>summary');if(summary&&menu){summary.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:w}));add('Navigation ouvrable',menu.open===true,'open='+menu.open)}else add('Navigation présente',false);const wrap=doc.querySelector('.top .wrap');if(wrap){const r=wrap.getBoundingClientRect(),delta=Math.abs(r.left-(w.innerWidth-r.right));add('Header centré',delta<3,'écart='+delta.toFixed(1)+'px');if(w.innerWidth>=1180){const ratio=r.width/w.innerWidth;add('Largeur desktop ≈ 80%',ratio>=.78&&ratio<=.82,Math.round(ratio*100)+'%')}}else add('Header centré',false);add('Toolbar présente',!!doc.querySelector('.floating-tools'));const help=doc.querySelector('[data-global-help]');if(help){help.click();setTimeout(()=>add('Aide contextuelle ouvrable',doc.querySelector('[data-global-help-panel]')?.classList.contains('open')===true),250)}else add('Bouton Aide présent',false)}catch(e){add('Exécution des tests',false,e.message)}},500)})})();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoke tests UI — MadaNotes</title><link rel="stylesheet" href="../assets/css/main.css?v=2.0.5"><style>body{padding:20px}.test-grid{display:grid;gap:8px;margin:16px 0}.test{padding:10px 12px;border:1px solid #dbe3dd;border-radius:10px;background:#fff}.pass{border-left:5px solid #16834f}.fail{border-left:5px solid #b23b35}.pending{border-left:5px solid #8a9690}iframe{width:100%;height:520px;border:1px solid #dbe3dd;border-radius:12px;background:#fff;margin:10px 0 24px}</style></head><body><main class="wrap"><h1>Smoke tests UI</h1><p class="muted">Contrôle automatique des héros et du header sur les principales structures de page MadaNotes.</p><div id="results" class="test-grid"></div><div id="frames"></div></main><script>(()=>{const pages=[['Accueil','../?smoketest=2.0.5'],['Solaire','../solaire/?smoketest=2.0.5'],['Quad','../quad/?smoketest=2.0.5'],['SOS','../sos/?smoketest=2.0.5'],['Upload','upload.html?smoketest=2.0.5']];const out=document.getElementById('results'),frames=document.getElementById('frames');const add=(name,ok,detail='')=>{const d=document.createElement('div');d.className='test '+(ok?'pass':'fail');d.textContent=(ok?'✓ ':'✗ ')+name+(detail?' — '+detail:'');out.appendChild(d)};let remaining=pages.length;pages.forEach(([name,src])=>{const h=document.createElement('h2');h.textContent=name;const f=document.createElement('iframe');f.src=src;f.title='Test '+name;frames.append(h,f);f.addEventListener('load',()=>setTimeout(()=>{try{const w=f.contentWindow,doc=f.contentDocument,hero=doc.querySelector('main>.hero,main.wrap>.hero'),header=doc.querySelector('.top .wrap');if(!hero){add(name+' — hero présent',false);return}const hr=hero.getBoundingClientRect(),cs=w.getComputedStyle(hero),left=hr.left,right=w.innerWidth-hr.right,delta=Math.abs(left-right),radius=parseFloat(cs.borderTopLeftRadius)||0;add(name+' — hero centré',delta<3,'écart '+delta.toFixed(1)+' px');add(name+' — hero arrondi 4 côtés',radius>=16,'rayon '+radius+' px');add(name+' — hero overflow masqué',cs.overflow==='hidden',cs.overflow);if(w.innerWidth>=1180){const ratio=hr.width/w.innerWidth;add(name+' — largeur hero ≈ 80%',ratio>=.78&&ratio<=.82,Math.round(ratio*100)+'%')}if(header){const r=header.getBoundingClientRect(),hd=Math.abs(r.left-(w.innerWidth-r.right));add(name+' — header centré',hd<3,'écart '+hd.toFixed(1)+' px')}if(name==='Accueil'){const quick=[...doc.querySelectorAll('.quick-nav a')];add('Accueil — 4 accès rapides',quick.length===4,String(quick.length));const menu=doc.querySelector('.site-menu'),summary=doc.querySelector('.site-menu>summary');if(summary&&menu){summary.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:w}));add('Accueil — Navigation ouvrable',menu.open===true,'open='+menu.open)}add('Accueil — toolbar présente',!!doc.querySelector('.floating-tools'))}}catch(e){add(name+' — exécution',false,e.message)}finally{remaining--;if(!remaining)add('Suite de tests terminée',true,'5 pages contrôlées')}},700))})})();</script></body></html>

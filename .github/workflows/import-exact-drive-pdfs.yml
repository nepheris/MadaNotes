name: Import exact Drive PDFs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-exact-drive-pdfs.yml"
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown
      - name: Download exact original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/documents/maison/machine-a-laver
          mkdir -p assets/documents/solaire/groupe assets/documents/solaire/batterie assets/documents/solaire/onduleur assets/documents/solaire/monitoring

          gdown 1Q9Z7WDFZG0nZkAlA06x0PPqcBF2PZa7D -O assets/documents/solaire/groupe/korman-3500w-01066672-dossier-technique.pdf
          gdown 1-F6bluoa2ix0h4s9apt1EebpIsZ9G_1Q -O assets/documents/solaire/batterie/greenline-m16s200bl-v-livret-technique.pdf
          gdown 1yGZLH2MqIh5Sqx6AUI5KnXsUuuaHcVcW -O assets/documents/solaire/onduleur/growatt-6kva-dossier-technique.pdf
          gdown 1LERsZCs2VbGpROScmpW17VE-cjEW99Cd -O assets/documents/solaire/monitoring/growatt-shinewifi-f-pro-guide-configuration.pdf
          gdown 13xccy1ZXDcvTpK7-jZeX1EANg0L6SWYW -O assets/documents/maison/machine-a-laver/touch-xqg60-1016p-livret-technique.pdf

          cat > /tmp/expected.sha256 <<'EOF'
          3e53abbcfe5e89391de83c4662bb29e22516e4efcd2ce664ac97a790c4ee77f5  assets/documents/solaire/groupe/korman-3500w-01066672-dossier-technique.pdf
          c2ab6a69a99f5123068b9d3b6f94d36bb7c85e2d3aacf919c3517e0da7b20f9d  assets/documents/solaire/batterie/greenline-m16s200bl-v-livret-technique.pdf
          9b4d88add63a23a43a8fae069c072667e6486223f7ec6176931ec9ae11844dc5  assets/documents/solaire/onduleur/growatt-6kva-dossier-technique.pdf
          3ff8337d28c3381ae3c02124896ae088920f686e8451d6d091194da4dcb18dab  assets/documents/solaire/monitoring/growatt-shinewifi-f-pro-guide-configuration.pdf
          44df5e15f61a0b08b2bf71dc45663c51b419ea56e20052e173237286e6c17c63  assets/documents/maison/machine-a-laver/touch-xqg60-1016p-livret-technique.pdf
          EOF
          sha256sum -c /tmp/expected.sha256

      - name: Commit exact originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documents/maison/machine-a-laver/touch-xqg60-1016p-livret-technique.pdf
          git add assets/documents/solaire/groupe/korman-3500w-01066672-dossier-technique.pdf
          git add assets/documents/solaire/batterie/greenline-m16s200bl-v-livret-technique.pdf
          git add assets/documents/solaire/onduleur/growatt-6kva-dossier-technique.pdf
          git add assets/documents/solaire/monitoring/growatt-shinewifi-f-pro-guide-configuration.pdf
          git commit -m "docs: replace derived PDFs with exact Drive originals"
          git push

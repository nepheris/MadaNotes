name: Build illustrated French quad manual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-quad-fr-illustrated.yml"
      - "sos/files/QuadPascal/build_manual_fr_illustre.py"
      - "sos/files/QuadPascal/Tao_Motor_TGA300F-01_T-Lander_300_Manuel_utilisateur_FR_source.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Build PDF
        run: |
          python sos/files/QuadPascal/build_manual_fr_illustre.py
          test -s sos/files/QuadPascal/Tao_Motor_TGA300F-01_T-Lander_300_Manuel_utilisateur_Traduction_bilingue_FR-EN.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sos/files/QuadPascal/Tao_Motor_TGA300F-01_T-Lander_300_Manuel_utilisateur_Traduction_bilingue_FR-EN.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date."
          else
            git commit -m "docs(quad): add illustrated French TGA300F-01 manual"
            git push
          fi

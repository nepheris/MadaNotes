name: Import Mada technical booklets

on:
  push:
    paths:
      - ".github/workflows/import-mada-livrets.yml"

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install downloader
        run: python -m pip install --quiet gdown
      - name: Download technical booklets from shared Drive files
        run: |
          set -euo pipefail
          mkdir -p assets/documents/solaire/groupe
          mkdir -p assets/documents/solaire/batterie
          mkdir -p assets/documents/solaire/onduleur
          mkdir -p assets/documents/solaire/monitoring
          mkdir -p assets/documents/maison/machine-a-laver
          gdown "https://drive.google.com/uc?id=1Q9Z7WDFZG0nZkAlA06x0PPqcBF2PZa7D" -O assets/documents/solaire/groupe/livret-technique-korman-3500w-mada.pdf
          gdown "https://drive.google.com/uc?id=1-F6bluoa2ix0h4s9apt1EebpIsZ9G_1Q" -O assets/documents/solaire/batterie/livret-technique-batterie-solaire-mada.pdf
          gdown "https://drive.google.com/uc?id=1yGZLH2MqIh5Sqx6AUI5KnXsUuuaHcVcW" -O assets/documents/solaire/onduleur/livret-technique-convertisseur-growatt-mada.pdf
          gdown "https://drive.google.com/uc?id=1LERsZCs2VbGpROScmpW17VE-cjEW99Cd" -O assets/documents/solaire/monitoring/livret-technique-modem-growatt-mada.pdf
          gdown "https://drive.google.com/uc?id=13xccy1ZXDcvTpK7-jZeX1EANg0L6SWYW" -O assets/documents/maison/machine-a-laver/livret-technique-machine-a-laver-futouch-mada.pdf
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documents
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Importe les livrets techniques Mada depuis Drive"
          git push

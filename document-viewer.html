<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualiseur PDF — MadaNotes</title><link rel="stylesheet" href="assets/css/main.css"><style>body{min-height:100vh;display:flex;flex-direction:column}.viewer-wrap{width:100%;flex:1;display:flex;flex-direction:column;min-height:0}.viewer-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.viewer-bar strong{flex:1}.viewer-frame{width:100%;flex:1;min-height:70vh;border:0;background:#eef2ef}.viewer-note{padding:8px 14px;font-size:.9rem;color:var(--muted);background:#fff;border-top:1px solid var(--line)}</style><script defer src="assets/js/site-nav.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="./">📄 Visualiseur PDF</a><nav data-site-nav></nav></div></header><main class="viewer-wrap"><div class="viewer-bar"><strong data-viewer-title>Document PDF</strong><a class="btn" data-open-original target="_blank" rel="noopener">↗ Ouvrir l’original</a></div><iframe class="viewer-frame" data-viewer-frame title="Document PDF"></iframe><div class="viewer-note">Si le serveur distant ou le navigateur force le téléchargement, utilisez « Ouvrir l’original ». Les PDF locaux du dépôt sont normalement visualisables directement ici.</div></main><script>(()=>{const q=new URLSearchParams(location.search),raw=q.get('url')||'';let url='';try{const u=new URL(raw,location.href);if(u.protocol==='https:'||u.origin===location.origin)url=u.href}catch{}const f=document.querySelector('[data-viewer-frame]'),a=document.querySelector('[data-open-original]');if(!url){document.querySelector('[data-viewer-title]').textContent='Document invalide';a.remove();f.srcdoc='<p style="font-family:system-ui;padding:2rem">Le lien du document est invalide.</p>';return}f.src=url;a.href=url;document.querySelector('[data-viewer-title]').textContent=q.get('title')||url.split('/').pop()||'Document PDF'})();</script></body></html>
